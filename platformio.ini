; freertos-esp32-patterns: six sketches, one PlatformIO environment each, plus `native` for
; the host tests of lib/patterns_core.
;
; Flash one:     pio run -e 01_queue -t upload && pio device monitor
; Host tests:    pio test -e native        (or `make check`, plain g++)

[platformio]
default_envs = 01_queue

[env]
test_framework = custom
build_flags =
    -std=gnu++17
    -Wall -Wextra

[esp32]
platform = espressif32@^6.9.0   ; Arduino-ESP32 core 2.0.x (ESP-IDF 4.4 FreeRTOS)
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
test_ignore = *                  ; unit tests run on the host only

[env:01_queue]
extends = esp32
build_src_filter = +<01_queue/>

[env:02_mutex]
extends = esp32
build_src_filter = +<02_mutex/>

[env:03_event_group]
extends = esp32
build_src_filter = +<03_event_group/>

[env:04_timer_vs_task]
extends = esp32
build_src_filter = +<04_timer_vs_task/>

[env:05_task_watchdog]
extends = esp32
build_src_filter = +<05_task_watchdog/>

[env:06_core_pinning]
extends = esp32
build_src_filter = +<06_core_pinning/>

[env:native]
; Runs test/test_native/test_core.cpp (self-contained asserts, see test/minitest.h).
platform = native
build_flags =
    ${env.build_flags}
    -DNATIVE_TEST
build_src_filter = -<*>
lib_compat_mode = off
